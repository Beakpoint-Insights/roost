name: PR checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: PR title is a Conventional Commit
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "Title: $PR_TITLE"
          if ! printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|refactor|perf|test|ci|build|chore|revert)(\([^)]+\))?!?: .+'; then
            echo "::error::The PR title must be a Conventional Commit, for example 'feat: add a skill' or 'fix(shape-epic): correct the test step'. release-please reads it when the PR is squash-merged."
            exit 1
          fi

  validate-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Validate the plugin and marketplace
        run: claude plugin validate --strict .
      - name: Check each skill's SKILL.md
        run: scripts/check-skills.sh
      - name: Test the private-details check
        run: scripts/check-private-details.test.sh

  private-details:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: No team's private details in the PR
        env:
          # One string per line: tracker sites, IDs, hostnames and the like that
          # belong in a team's own config. It's a secret so this check doesn't
          # publish the values it guards.
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -z "$FORBIDDEN_STRINGS" ]; then
            echo "::warning::Skipped: the FORBIDDEN_STRINGS secret isn't available (a PR from a fork, or it isn't set). A maintainer runs this check before merging."
            exit 0
          fi
          list=$(mktemp)
          printf '%s\n' "$FORBIDDEN_STRINGS" > "$list"
          scripts/check-private-details.sh "$list" "$BASE_SHA" "$HEAD_SHA"
