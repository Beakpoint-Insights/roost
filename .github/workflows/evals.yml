name: Evals

# Runs the eval cases only when someone asks, since every run is a real Claude
# session paid for by the credential below:
# - a PR labelled run-evals: the cases its changes can affect (scripts/eval-cases.sh),
#   once each, when the label is added and on each push while it stays on;
# - the release PR, when it's reopened to start its checks: the cases whose skills
#   changed since the last release, once each;
# - a run started by hand (gh workflow run Evals): the same by default; name cases
#   with -f cases="a b", or run every case with -f all=true (and -f runs=3).
# Needs ANTHROPIC_API_KEY (an API key from the Claude Console), or
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, which uses a subscription).

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:
    inputs:
      cases:
        description: "Cases to run, space-separated (blank: the cases whose skills changed since the last release)"
        required: false
        default: ""
      all:
        description: "Run every case"
        type: boolean
        default: false
      runs:
        description: "Runs per case"
        type: choice
        options: ["1", "3"]
        default: "1"

permissions:
  contents: read
  pull-requests: write

jobs:
  evals:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.head_ref, 'release-please--') && github.event.action == 'reopened') ||
      (contains(github.event.pull_request.labels.*.name, 'run-evals') &&
       (github.event.action != 'labeled' || github.event.label.name == 'run-evals'))
    # On the job, not the workflow: a run whose job is skipped (an unrelated label
    # added) must not cancel one that's running.
    concurrency:
      group: evals-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Choose the cases
        id: cases
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_CASES: ${{ inputs.cases }}
          INPUT_ALL: ${{ inputs.all }}
          INPUT_RUNS: ${{ inputs.runs }}
        run: |
          # Every run is paid for, so by default only what changed runs, once (with
          # one retry). Every case, three times, only when asked for by hand.
          last_release=$(git describe --tags --abbrev=0 --match 'roost-v*' "$HEAD_SHA" 2>/dev/null || true)
          runs=1
          if [ "$EVENT" = workflow_dispatch ]; then
            runs=${INPUT_RUNS:-1}
            if [ -n "$INPUT_CASES" ]; then
              cases=$INPUT_CASES
            elif [ "$INPUT_ALL" = true ] || [ -z "$last_release" ]; then
              cases=$(scripts/eval-cases.sh --all)
            else
              cases=$(scripts/eval-cases.sh "$last_release" "$HEAD_SHA")
            fi
          elif [[ "$HEAD_REF" == release-please--* ]]; then
            # A release: the cases whose skills changed since the last release. Compare
            # with the PR's base (what merged since), not its head, whose version bump
            # in the plugin manifests would otherwise select every case.
            if [ -n "$last_release" ]; then
              cases=$(scripts/eval-cases.sh "$last_release" "$BASE_SHA")
            else
              cases=$(scripts/eval-cases.sh --all)
            fi
          else
            cases=$(scripts/eval-cases.sh "$BASE_SHA" "$HEAD_SHA")
          fi
          echo "cases=$(echo $cases)" >> "$GITHUB_OUTPUT"
          echo "runs=$runs" >> "$GITHUB_OUTPUT"
          echo "Cases to run: ${cases:-none}"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.cases.outputs.cases != ''
        with:
          node-version: 22
      - name: Install Claude Code
        if: steps.cases.outputs.cases != ''
        run: npm install -g @anthropic-ai/claude-code@2.1.296
      - name: Run the evals
        id: run
        if: steps.cases.outputs.cases != ''
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CASES: ${{ steps.cases.outputs.cases }}
          RUNS: ${{ steps.cases.outputs.runs }}
          # A ceiling on each attempt of each case, so a runaway case stops.
          MAX_COST_USD: "5"
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Skipped: no Claude credential (CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY). PRs from forks don't get secrets; a maintainer runs the evals before merging."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          failed=0
          scripts/run-evals.sh "$RUNS" $CASES || failed=1
          scripts/eval-summary.py eval-json > eval-summary.md
          cat eval-summary.md
          cat eval-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $failed
      # Each run's prompt, reply and grader verdicts, to read why a case failed.
      - name: Keep the results
        if: always() && steps.run.outcome != 'skipped' && steps.run.outputs.skipped != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eval-results
          path: |
            eval-json/
            eval-logs/
            evals/results/
          retention-days: 30
      - name: Post the results on the PR
        if: always() && github.event_name == 'pull_request' && steps.run.outcome != 'skipped' && steps.run.outputs.skipped != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f eval-summary.md ] || echo "### Evals"$'\n\n'"The run failed before it could summarize." > eval-summary.md
          printf '\n[Full run](%s)\n' "$RUN_URL" >> eval-summary.md
          # Keep one evals comment per PR, updated in place.
          gh pr comment "$PR" --edit-last --body-file eval-summary.md 2>/dev/null || gh pr comment "$PR" --body-file eval-summary.md
