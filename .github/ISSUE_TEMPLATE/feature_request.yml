name: Feature request
description: Suggest a new skill, or a change to how one works.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How roost could help. Which skills it touches, if you know.
    validations:
      required: true
